services:
  api-dev:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    volumes:
      # Mount local code for hot-reloading
      - ./app:/app/app 
    environment:
      - ENVIRONMENT=development

  api-prod:
    build:
      context: .
      target: prod
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - UVICORN_WORKERS=4 # Override workers if needed
    restart: always
    
  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: example

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080