services:
  api-dev:
    build:
      context: .
      target: dev
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./public:/app/public
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://estudiantes:123@db:5432/mi_base_datos}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_local

  api-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $$UVICORN_WORKERS"
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      UVICORN_WORKERS: 4
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://estudiantes:123@db:5432/mi_base_datos}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - red_local

  db:
    image: postgres:16-alpine
    container_name: estudiantes-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estudiantes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-mi_base_datos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red_local

  adminer:
    image: adminer:latest
    container_name: estudiantes-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_local

volumes:
  postgres_data:

networks:
  red_local:
    driver: bridge