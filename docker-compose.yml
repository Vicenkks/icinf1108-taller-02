services:
  api-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./public:/app/public
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_local

  api-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      UVICORN_WORKERS: 4
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - red_local

  db:
    image: postgres:16-alpine
    container_name: estudiantes-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red_local

  adminer:
    image: adminer:latest
    container_name: estudiantes-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_local

volumes:
  postgres_data:

networks:
  red_local:
    driver: bridge