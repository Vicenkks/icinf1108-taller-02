services:
  api-dev:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    volumes:
      # Mount local code for hot-reloading
      - ./app:/app/app 
    environment:
      - ENVIRONMENT=development

  api-prod:
    build:
      context: .
      target: prod
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - UVICORN_WORKERS=4 # Override workers if needed
    restart: always